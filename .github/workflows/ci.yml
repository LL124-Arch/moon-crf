name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: moonbit-community/setup-moonbit@main
        with:
          version: latest

      - name: Update registry
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check
        run: moon check --deny-warn --target all

      - name: Build
        run: moon build --deny-warn

      - name: Test
        run: moon test --deny-warn

      - name: CLI smoke test
        run: |
          moon run cmd/main -- train examples/sample.conll /tmp/mooncrf.model.json --l2 0.01 --iterations 100
          moon run cmd/main -- eval /tmp/mooncrf.model.json examples/sample.conll
